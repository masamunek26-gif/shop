[databases]
shop = host=pg-primary port=5432 dbname=shop

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = shop

pool_mode = transaction
max_client_conn = 200
default_pool_size = 15
reserve_pool_size = 5
ignore_startup_parameters = extra_float_digits